[基本操作]
关于界面=1/当你的鼠标悬浮在按钮上方静止2秒，就能看见该按钮的功能提示。或者，在F12中--系统设置--游戏功能，查看界面功能按钮的说明。
关于世界观=2/你可以点击游戏界面右上方，微缩地图下面，右起第一个按钮查看。（快捷键Ctrl+J）
关于地图=3/你可以点击游戏界面右上方，微缩地图下面，左起第二个按钮查看。（快捷键Ctrl+TAB）
人物如何移动=4/鼠标右键点击某处地面时，人物会自动跑到那个位置去
角色死亡=5/角色死亡以后，画面变为灰白色效果怎么办？ 你可以从游戏中小退（返回人物选择界面），再进入游戏。此时，你将返回安全区，而不是你死亡的那个地点。
目标=6/左键确定目标，右键行动（奔跑、交谈等）。
战斗=7/首先选中你的敌人，（战士需要左键点选敌人，法师和道士则只需鼠标悬浮）。然后冲到它们的面前，挥动你手中的武器，或是按下预设的技能快捷键对你的敌人使用技能。
技能快捷键=8/点击技能界面（快捷键F11）--点击你想使用的技能--选择技能快捷键--确定。
捡起战利品=9/怪物死后，物品会掉落在地面上。将鼠标移动到物品上面将会出现该物品的描述。
挖取战利品=10/有些怪物死后，尸体会出现闪光的特效，你可以从它们 的尸体上面挖出一些特殊物品，比如肉或是怪物的晶核。
作揖=11/按Ctrl+S键，你会做一个作揖动作。
快捷使用物品=12/将物品（比如血药，蓝药等）从背包中拖到聊天框上方1--6对应的道具框中，按下对应的快捷键即可使用，这样可以免除临时需要打开背包的麻烦。
摆摊=13/你可以通过游戏界面底部中间--聊天显示区域右边--点击“摆摊”按钮。快为你的摊位取个响亮的名字，开始经营自己的小生意吧！
[游戏设置]
新手教程的开关=14/你可以尝试通过F12设置--游戏设置--基本--开启新手教程，教程将为你提示如何进行传世无双的游戏教程。
让游戏窗口化=15/你可以尝试启用F12设置--系统设置--图像设置--窗口模式，这样你可以在非全屏幕的窗口模式下进行游戏。
让窗口透明化=16/你可以尝试启用F12设置--系统设置--图像设置--窗口透明度，左右拖动滑动条，可调节窗口的透明程度。
开启、禁止声音=17/你可以尝试通过F12设置--系统设置--声音设置--开启生效，你即可享受到游戏内的优美音乐。
调节声音大小=18/你可以尝试通过F12设置--系统设置--声音设置--拖动滑动条，你即可享受到游戏内的声音特效。
显示目标的生命条=19/你可以通过勾选F12设置--系统设置--游戏功能--血条显示--开，尝试解决此问题。
[功能按钮说明]
F9键=20/F9对应的是人物包裹界面的快捷键。
F10键=21/F10对应的是人物属性等相关信息的查询快捷键。
F11键=22/点击技能界面（快捷键F11）--点击你想使用的技能--选择技能快捷键--确定。
F12键=23/F12对应的是调节游戏界面、游戏功能、游戏辅助功能的快捷键。
[名词解释]
生命值=24/吃一些东西，比如金创药，天山雪莲可以加快角色生命的恢复。
魔法值=25/吃一些东西，比如魔法药，深海灵礁可以加快角色法力的恢复。
敌对怪物=26/有些怪物会主动攻击你，而另一些则不会。想要区分它们？当你靠近它们的时候，会冲向你的，就是主动攻击型的。
经验宝玉=27/可吸收打怪获得的经验，吸满经验后双击并消耗相应精力值就可为人物增加经验宝玉内的经验值。
荣耀值=28/打怪、做任务参加活动等就可累积，可在中州皇宫的荣耀特使处换取物品。
珍宝值=29/20级以后消灭任意怪物都可以获得珍宝值。每当珍宝值累积满一条时都会点亮一颗珍宝珠，并获得一次怪物大爆的机会以及一定的荣耀点。四颗珍宝珠全部点亮以后，会获得10分钟的双倍爆率时间。
发型=33/美发师（中州的393，180）可以为你的头发染色，并为你设计出贴心的造型。
[任务]
叹号和问号=34/有任务可给的NPC会有一个感叹号飘在他们头顶。左键点击这些NPC和他们对话，他们会告诉你，下一步你需要做些什么。
活动日志=35/你可以点击游戏界面右上方，微缩地图下面，左起第一个按钮查看。（快捷键Ctrl+N）
[互动]
查看周围NPC和玩家=36/你可以点击游戏界面右上方，微缩地图下面，左起第一个按钮查看。（快捷键Ctrl+K）
与附近的玩家交谈=37/按下回车键，输入你想说的话，然后再次按回车。你附近的玩家便能收到这条信息。
发送悄悄话=38/在聊天框内按如下格式输入，/人名+空格+说话内容，即可私聊。
过滤聊天信息=39/你可以通过游戏界面底部中间--聊天显示区域左边--选择不同的内容过滤器，过滤玩家发表的言论。
添加好友=40/你可以通过游戏界面底部右侧--主功能区--显示社交界面--人脉。把你的好友记录下来，他们或许能为你下一次冒险或旅行提供帮助。（快捷键Ctrl+I）
如何组队=41/你可以通过游戏界面底部中间--聊天显示区域右边--点击“与其他玩家进行组队”按钮—添加附近玩家到你的队伍中。
组队的人数限制=42/目前确定的小队人数是5个。
如何交易=43/你可以通过游戏界面底部中间--聊天显示区域右边--点击“与其他玩家进行交易”按钮。与其他玩家交易的时候，你们必须“面对面”。
如何加入行会=44/与行会会长面对面--输入命令：@加入门派--等待行会会长添加。
如何求助=45/当你有困难的时候，别忘了向其他玩家求助，或是向彩虹帮助求助。彩虹帮助的入口，就是点击界面右下方的那个“问”字。
[战斗指南]
了解你的战斗技能=46/仔细阅读你的技能说明，有些是需要你主动触发的，有些则是被动存在的。
技能快捷键=47/点击技能界面（快捷键F11）--点击你想使用的技能--选择技能快捷键--确定。
切换攻击模式=48/失去新手保护后，你在非安全区时可能遭受来自其他玩家的攻击。选择合适的攻击模式才能应对随时可能面临的危险。
关于PK=49/你可以通过调节游戏界面右上方，微缩地图右边的攻击方式，来调整自己的攻击对象。PK是要加PK值的。
[武器与防具强化]
可以强化的道具=50/目前游戏内除勋章、宝石，以及特殊说明的情况之外，所有的装备和武器均可进行强化。
武器强化材料=51/1.待升级的武器一件；\2.附加的黑铁矿石若干；\3.附加的首饰若干；\4.金币；\5.幸运符或极品幸运符（非必须）；\6.护宝符（非必须）。
武器强化的步骤=52/1.至中州铸造师（421，246）处；\2.将需要升级的武器、附加的矿石、首饰全部交给NPC。（注：如果你有重要的东西，请存在仓库里）；\3.强化成功：每成功升一级，装备某属性（与用于强化的首饰属性相关）上限提高1点，星星增加1颗，附加的矿石、首饰消失；\4.强化失败：原始装备、附加的矿石、首饰全部消失。
装备强化的材料需求=53/1.待升级的装备一件；\2.魔法（攻击、道术）强化符天级（地级）；\3.金币；\4.幸运符或极品幸运符（非必须）；\5.护宝符（非必须）；\注：装备强化不包括武器、勋章。
装备强化的步骤=54/1.至英雄岛的符石镶嵌商人（60，133）；\2.将需要升级的防具、“天级强化符”（适用于孔痕≥3的防具）或者“地级强化符”（适用于孔痕＜3的防具）全部交给NPC；\3.强化成功：每成功升一级，装备属性上限提高1点(属性由放入的强化符决定)；\4.强化失败：原始装备、强化符全部消失。\注：装备强化不包括武器、勋章。
提高强化成功概率=55/在装备（武器或是防具）强化中加入幸运符或是极品幸运符均可以提高强化的成功率。极品幸运符提高的效果更好。
强化防碎=56/在强化中加入护宝符，可以保证装备（武器或是防具）强化失败不破碎。
强化的最高等级=57/目前，装备（武器或是防具）强化的最高等级为8，装备下方因强化增加的星星最多增加8颗。
强化与星级=58/装备（武器或是防具）每成功强化1级，装备下方的星星增加1颗；装备最多可以强化8次，装备下方因强化增加的星星最多增加8颗。
强化与天生极品=59/装备（武器或是防具）下方的星星最多有11颗，其中8颗是强化到8级的，另外3颗是由装备天生的品质所决定的（即天生小极品）。
强化星与天生星=60/天生小极品的星星排在强化的星星前面。天生小极品的星星是以红色色显示的，因强化而获得星星是以黄色色显示的。
[装备打孔与镶嵌符石]
关于装备打孔=61/1.至英雄岛的符石镶嵌商人（60，133）处；\2.将含有闭合孔洞的装备、打孔道具全部放入打孔界面内；\3.强化失败：打孔道具会消失，装备退还；\4.打孔成功：打孔道具消失，装备增加对应属性的可镶嵌孔洞。
可以打孔的道具=62/可以打孔的装备种类：20级以上的帽子、衣服、武器、项链、戒指、手镯、鞋子、腰带均可打孔。
关于孔的数量=63/孔的数量是在装备产出的时候随机决定的。打孔时，默认以从左至右的顺序依次进行。
关于孔的五行=64/孔的五行属性由采用的打孔道具决定，使用五行之彩箭进行打孔后随机生成孔属性。
孔的五行转换=65/孔洞五行转换--使用道具“转换乾坤”--孔洞变化为新的五行属性注意：已镶嵌符石的孔洞不可进行属性转换，除非把符石摘除。
关于符石=66/符石可以镶嵌到装备的孔洞中，但是要求符石与孔洞的五行属性一致。各五行符石均分为攻击符石和防御符石。目前，不论何种五行的攻击或是防御符石，均有为普通和纯净两种。纯净符石的属性优于普通。
关于符石雕琢=67/1.至英雄岛的符石镶嵌商人（60，133）处；\2.雕琢可以使符石的品质更好，属性更高；\3.符石雕琢需要对应等级的符石雕琢符；\4.任一普通符石只可雕琢一次；\5.雕琢100%成功\6.雕琢后的符石不能再进行合成。
关于符石合成=68/1.至英雄岛的符石镶嵌商人（60，133）处符石都可以由低等级符石合成高等级符石；\2.合成大符石最多需要5颗同类低一级符石，最少需要3颗同类小符石；\3.每种符石目前最多可升至5级。符石合成符分1-4级，分别对应1-4级的符石合成之用。每等级符石合成符价格不等；\4.合成失败：符合、符石合成符全部消失。
符石镶嵌的材料=69/1.已激活空白孔洞的装备；\2.五行与孔洞一致的符石；\3.符石镶嵌符（低级或者高级）；\4.金币。
同属性镶嵌个数=70/理论上，同一装备可镶嵌任意数量的相同五性属性的符石 。
关于符石摘除=71/1.至英雄岛的符石镶嵌商人处\2.玩家可以把已镶嵌的符石从装备中拆除下来；\3.摘除需要“符石摘除符”，成功率为100%；\4.符石摘除符道具分为5级，摘除对应等级符石；\5.拆除下来的符石是不可交易的。
[圣殿纹佩系统]
关于圣殿纹佩=72/1.圣殿纹佩是一件与人物绑定的，带有一定属性的装备。\2.圣殿纹佩与人物是完全绑定的，不可交易、丢弃，也不会因为被杀死而爆出。\3.圣殿纹佩相关的大部分操作都可以通过人物包裹界面（默认按键F9）左上角的圣殿纹佩按钮来进行。
圣殿纹佩部件的获得=73/1.部件一共分为主饰纹、辅饰纹、边纹、底纹4个部位，要获得相应的部件，可以先在圣殿纹佩界面中的纹佩图鉴页签中领取任务来进行，完成任务之后即可获得相应的纹佩部件。\2.圣殿纹佩部件任务与普通任务相同，最多只能同时领取10个任务。\3.完成任务之后，必须在纹佩图鉴页签中点击领取纹佩按钮才能获得纹佩部件。而在任务进行过程中随时都可以在纹佩图鉴界面中确认其完成进度\4.完成任务之后纹佩部件会自动放入人物包裹中，双击才会放入纹佩包裹。放入纹佩包裹后的纹佩部件将不会再占用人物的包裹格，同时也只有放入纹佩包裹中的部件才可以进行合成、分解的工作。
圣殿纹佩部件的合成=74/1.当主饰纹、辅饰纹、边纹、底纹部位的部件都至少取得1件之后，就可以在纹佩包裹界面中进行合成。\2.在纹佩包裹界面中，在页签中选择相应的部件，然后点击合成即可获得合成之后的圣殿纹佩。合成的过程中可以确认其最终合成时的外形与。\3.圣殿纹佩合成之后，变为一件带有属性的装备，使用的方式与其他装备相同。\4.合成后圣殿纹佩的属性等同于各个部件属性的相加，但是在合成时可能会出现特别的附加属性——圣者属性。圣者属性的会在下面会有独立的说明。
圣殿纹佩的拆分=75/1.圣殿纹佩合成之后，如果获得了属性更好的某一部件，或者已有的合成了太多而觉得占人物包裹的时候，可以选择将圣殿纹佩重新拆分为部件。\2.右键点击人物包裹中的圣殿纹佩，即可将其重新拆分为部件存放到纹佩包裹中，不再占用人物包裹。该过程需要收取100点精力值。
圣殿纹佩部件的分解=76/1.多余的圣殿纹佩部件可以通过圣殿纹佩界面中的分解界面将其分解为纹佩精华。\2，	纹佩精华分为初级、中级、高级3种等级，纹佩部件的品质越好则其可能分解出高级精华的概率就越高。\3.分解纹佩的时候会收取一定的声望值，收取的数量也与纹佩部件的品质相关。
圣者属性的说明=77/1.圣殿纹佩在组合一些特殊的组合、或者一定的概率下可能会产生强力的圣者属性，这些属性在纹佩的说明中会用醒目的标识显示。圣者属性一般都是一些比较稀有的属性。\2.带有圣者属性的纹佩可以使用中州皇宫的纹佩精炼炉处使用纹佩精华为其精炼，从而提升其圣者属性的精华等级。\3.在精炼时，使用不同等级的纹佩精华精炼的成功率也不同，精华等级越高则成功率越高。使用幸运符可以提升其成功率。
[其他]
彩虹帮助=101/彩虹帮助是用户在线帮助服务统一平台，您可以通过“随心搜索、即时交流、随处分享”的方式获得帮助或提供帮助。
[NewHandPrompt]
