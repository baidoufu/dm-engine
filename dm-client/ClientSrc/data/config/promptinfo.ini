拜访英雄雕像=3/0你可以在村落中找到通往英雄岛的路，那里有代表你这个职业最高成就者的雕像。当然，你也可以选择马上去开始做第一个任务。
当角色死亡=4/0角色死亡以后，画面变为灰白色效果怎么办？您可以从游戏中小退（返回人物选择界面），再进入游戏。此时，您将返回安全区，而不是您死亡的那个地点。
与附近的玩家交谈=5/0按下回车键，输入你想说的话，然后再次按回车。你附近的玩家便能收到这条信息。
如何组队=6/0您可以通过游戏界面底部中间--聊天显示区域右边--点击“与其他玩家进行组队”按钮—添加附近玩家到您的队伍中。
让游戏窗口化=7/0您可以尝试启用F12设置--图像设置--窗口模式，这样您可以在非全屏幕的窗口模式下进行游戏。
发送一条悄悄话=8/0在聊天框内按如下格式输入，/人名+空格+说话内容，即可私聊。
如何求助=9/1当你有困难的时候，别忘了向其他玩家求助，或是向彩虹帮助求助。彩虹帮助的入口，就是点击界面右下方的那个“问”字。
关于游戏设置=10/0F12对应的是调节游戏界面、游戏功能、游戏辅助功能的快捷键。
关于界面=11/0当你的鼠标悬浮在按钮上方静止2秒，就能看见该按钮的功能提示。或者，在F12中--系统设置--游戏功能，查看界面功能按钮的说明。
如何交易=12/0您可以通过游戏界面底部中间—聊天显示区域右边—点击“与其他玩家进行交易”按钮。与其他玩家交易的时候，你们必须“面对面”。
技能快捷键=13/0点击技能界面（快捷键F11）--点击你想使用的技能--选择技能快捷键--确定。
了解你的技能=14/0仔细阅读你的技能说明，有些是需要你主动触发的，有些则是被动存在的。
让窗口透明化=15/0您可以尝试启用F12设置--系统设置--图像设置--窗口透明度，左右拖动滑动条，可调节窗口的透明程度。
开启、禁止声音=16/0您可以尝试通过F12设置--系统设置--声音设置--开启生效，您即可以享受到游戏内的优美音乐。
作揖=17/0点击聊天信息框右侧作揖按钮后，你会做一个的作揖动作。
切换攻击模式=19/0失去新手保护后，你在非安全区时可能遭受来自其他玩家的攻击。选择合适的攻击模式才能应对随时可能面临的危险。
怪物晶核=20/0怪物晶核是制炼药类等物品的必要材料，学习了制炼技能就可进行物品制炼。（某些BOSS身上会出产特殊的晶核。）
目标=22/0左键确定目标，右键行动（奔跑、交谈等）。
生命值=23/0吃一些东西，比如金创药，天山雪莲可以加快角色生命的恢复。
魔法值=24/0吃一些东西，比如魔法药，深海灵礁可以加快角色法力的恢复。
战斗=25/0首先选中你的敌人，（战士需要左键点选敌人，法师和道士则只需鼠标悬浮）。然后冲到它们的面前，挥动你手中的武器，或是按下预设的技能快捷键对你的敌人使用技能。
敌对怪物=26/0有些怪物会主动攻击你，而另一些则不会。想要区分它们？当你靠近它们的时候，会冲向你的，就是主动攻击型的。
捡起战利品=27/0怪物死后，物品会掉落在地面上。将鼠标移动到物品上面将会出现该物品的描述。
挖取战利品=28/0有些怪物死后，尸体会出现闪光的特效，你可以从它 们的尸体上面挖出一些特殊物品，比如肉或是怪物的晶核。
快捷使用物品=29/0将物品（比如血药等）从背包中拖到聊天框上方1--6对应的道具框中，按下对应的数字即可快捷的使用，这样可以免除临时需要打开背包的麻烦。
彩虹帮助=30/0彩虹帮助是用户在线帮助服务统一平台，您可以通过“随心搜索、即时交流、随处分享”的方式获得帮助或提供帮助。
调节声音大小=32/0您可以尝试通过F12设置--系统设置--声音设置--拖动滑动条，您即可享受到游戏内的声音特效。
显示目标的生命条=33/0您可以通过勾选F12设置--系统设置--游戏功能--血条显示--开，尝试解决此问题。
中州历史=34/0您可以点击游戏界面右上方，微缩地图下面，右起第一个按钮查看。（快捷键：Ctrl+J）
地图=35/0您可以点击游戏界面右上方，微缩地图下面，左起第二个按钮查看。（快捷键：Ctrl+TAB）
活动日志=36/0您可以点击游戏界面右上方，微缩地图下面，左起第一个按钮查看。（快捷键：Ctrl+N）
查找周围人物=37/0您可以点击游戏界面右上方，微缩地图下面，左起第一个按钮查看。（快捷键：Ctrl+K）
过滤聊天信息=38/0您可以通过游戏界面底部中间—聊天显示区域左边—选择不同的内容过滤器，过滤玩家发表的言论。
如何加入行会=39/0与行会会长面对面--输入命令：@加入门派--等待行会会长添加。
如何添加好友=40/0您可以通过游戏界面底部右侧—主功能区—显示社交界面—人脉。把您的好友记录下来，他们或许能为您下一次冒险或旅行提供帮助。（快捷键：Ctrl+I）
如何摆摊=41/0您可以通过游戏界面底部中间—聊天显示区域右边—点击“摆摊”按钮。快为您的摊位取个响亮的名字，开始经营自己的小生意吧！
关于PK=42/0您可以通过调节游戏界面右上方，微缩地图右边的攻击方式，来调整自己的攻击对象。PK是要加PK值的。
关于发型=43/0美发师（中州的393，180）可以为您的头发染色，并为您设计出贴心的造型。
组队的人数限制=44/0目前确定的小队人数是5个。
装备和武器强化=45/0目前游戏内除勋章、宝石，以及特殊说明的情况之外，所有的装备和武器均可进行强化。
武器强化=46/0至中州铸造师（421，246）处。
防具强化=47/0至英雄岛的符石镶嵌商人（60，133）处。
装备强化成功率=48/0在装备（武器或是防具）强化中加入幸运符或是极品幸运符均可以提高强化的成功率。极品幸运符提高的效果更好。
装备强化不破碎=49/0在强化中加入护宝符，可以保证装备（武器或是防具）强化失败不破碎。
装备强化最高等级=50/0目前，装备（武器或是防具）强化的最高等级为8，装备下方因强化增加的星星最多增加8颗。
装备强化与星级=51/0装备（武器或是防具）每成功强化1级，装备下方的星星增加1颗；装备最多可以强化8次，装备下方因强化增加的星星最多增加8颗。
强化与天生极品=52/0装备（武器或是防具）下方的星星最多有11颗，其中8颗是强化到8级的，另外3颗是由装备天生的品质所决定的（即天生小极品）。
强化星与天生星=53/0天生小极品的星星排在强化的星星前面；天生小极品的星星是以红色显示的。因强化而获得星星是以黄色色显示的。
关于装备打孔=54/0至英雄岛的符石镶嵌商人（60，133）；将含有闭合孔洞的装备、打孔道具全部交给NPC。
可以打孔的道具=55/0可以打孔的装备种类为：20级以上帽子、衣服、武器、项链、戒指、手镯、鞋子、腰带均可打孔。
关于孔的数量=56/0孔的数量是在装备产出的时候随机决定的。打孔时，默认以从左至右的顺序依次进行。
关于孔的五行=57/0孔的五行属性由采用的打孔道具决定，使用五行之彩箭进行打孔后随机生成孔属性。
孔的五行转换=58/0孔洞五行转换--使用道具“转换乾坤”--孔洞变化为新的五行属性。注意：已镶嵌符石的孔洞不可进行属性转换，除非把符石摘除。
关于符石=59/0符石可以镶嵌到装备的孔洞中，但是要求符石与孔洞的五行属性一致。各五行符石均分为攻击符石和防御符石。目前，不论何种五行的攻击或是防御符石，均有为普通和纯净两种。纯净符石的属性优于普通。
符石镶嵌商人=60/0符石镶嵌商人将为您提供符石雕琢、符石合成、符石镶嵌、符石摘除等相关服务。
同属性符石的镶嵌=61/0理论上，同一装备可镶嵌任意数量的相同五性属性的符石。
